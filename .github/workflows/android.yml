name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      ads:
        description: 'AdMob IDs: test or real'
        default: 'test'
  push:
    branches: [main]
    paths-ignore: ['admin.js','admin.html','docs/**','fn/**','.github/workflows/android-admin.yml','.github/workflows/backup.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp ads.js www/ads.js
          cp -r index.html app.js common.js style.css manifest.json sw.js supabase.js logo.png icons img brands www/
      - name: Ads config
        run: |
          MODE="${{ github.event.inputs.ads || 'test' }}"
          if [ "$MODE" = "real" ]; then
            APPID='ca-app-pub-1036618994904808~7606603130'; B='ca-app-pub-1036618994904808/6293521467'; I='ca-app-pub-1036618994904808/3360236363'; T=false
          else
            APPID='ca-app-pub-3940256099942544~3347511713'; B='ca-app-pub-3940256099942544/6300978111'; I='ca-app-pub-3940256099942544/1033173712'; T=true
          fi
          echo "window.ADS_CONFIG={test:$T,banner:'$B',interstitial:'$I'};" > www/ads-config.js
          echo "window.APP_BUILD=${{ github.run_number }};" >> www/ads-config.js
          echo "$APPID" > admob_app_id.txt
          echo "ASSET=StorePlus-$MODE-ads.apk" >> $GITHUB_ENV
      - run: npm install
      - run: npx cap add android
      - name: Android permissions and icon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M
          python3 - <<'PY'
          import re
          m='android/app/src/main/AndroidManifest.xml'
          t=open(m).read()
          aid=open('admob_app_id.txt').read().strip()
          t=t.replace('</application>','<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/></application>'%aid)
          open(m,'w').write(t)
          PY
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
      - name: Launcher icons and splash
        run: |
          R=android/app/src/main/res
          rm -f $R/mipmap-*/ic_launcher*.png $R/mipmap-anydpi-v26/ic_launcher*.xml
          cp -r androidres/mipmap-* $R/
          cp androidres/values/ic_launcher_background.xml $R/values/
          for f in $(find $R -name splash.png); do cp androidres/splash.png $f; done
      - run: npx cap sync android
      - name: Stable signing key and increasing versionCode
        env:
          KS_B64: ${{ secrets.CUSTOMER_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CUSTOMER_KEYSTORE_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          echo "$KS_B64" | base64 -d > android/app/customer.keystore
          python3 ci/patch_customer_gradle.py
      - name: Build signed release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.CUSTOMER_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signature and version
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs $APK | grep -E "SHA-256|Verifies"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/aapt dump badging $APK | grep -E "package:|application-label:"
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk $ASSET
          gh release delete latest-$ASSET --yes --cleanup-tag || true
          gh release create latest-$ASSET $ASSET --title "Store Plus APK" --notes "Build ${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: StorePlus-apk
          path: ${{ env.ASSET }}
