name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp -r index.html app.js common.js style.css manifest.json sw.js supabase.js logo.png icons img brands www/
      - run: npm install
      - run: npx cap add android
      - name: Android permissions and icon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StorePlus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StorePlus.apk --title "Store Plus APK" --notes "Latest build"
      - uses: actions/upload-artifact@v4
        with:
          name: StorePlus-apk
          path: StorePlus.apk
