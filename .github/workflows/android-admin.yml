name: Build Admin APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare admin web files
        run: |
          mkdir www
          cp admin.html www/index.html
          cp admin.js common.js style.css manifest.json sw.js supabase.js logo.png www/
          cp -r icons img brands www/
          python3 - <<'PY'
          p='www/admin.js'
          t=open(p).read()
          marker="viewLogin(); return toast('هذا الحساب ليس حساب مشرف', true); }"
          assert marker in t, 'marker missing'
          snippet=" try{const _C=window.Capacitor;if(_C&&_C.isNativePlatform&&_C.isNativePlatform()){const _P=_C.Plugins.PushNotifications;try{await _P.createChannel({id:'default',name:'Store Plus Admin',description:'تنبيهات الطلبات',importance:5,visibility:1,sound:'default',vibration:true});}catch(e){}enablePush(true).catch(()=>{});}}catch(e){}"
          t=t.replace(marker,marker+snippet,1)
          open(p,'w').write(t)
          PY
      - name: Admin app identity
        run: |
          echo '{"appId":"com.storeplus.admin","appName":"تطبيق إدارة متجر بلس","webDir":"www","backgroundColor":"#050a1f","android":{"allowMixedContent":false}}' > capacitor.config.json
          cat > package.json <<'JSON'
          {"name":"storeplus-admin","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2","@capacitor/app":"^6.0.2","@capacitor/push-notifications":"^6.0.2"}}
          JSON
      - run: npm install
      - run: npx cap add android
      - name: Permissions, Firebase config, icons
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M
          cp google-services-admin.json android/app/google-services.json
          R=android/app/src/main/res
          rm -f $R/mipmap-*/ic_launcher*.png $R/mipmap-anydpi-v26/ic_launcher*.xml
          cp -r androidres/mipmap-* $R/
          cp androidres/values/ic_launcher_background.xml $R/values/
          mkdir -p $R/raw && cp androidres/raw/notify.mp3 $R/raw/
          for f in $(find $R -name splash.png); do cp androidres/splash.png $f; done
      - run: npx cap sync android
      - name: Stable signing key and increasing versionCode
        env:
          KS_B64: ${{ secrets.ADMIN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          echo "$KS_B64" | base64 -d > android/app/admin.keystore
          python3 ci/patch_admin_gradle.py
          grep -n "signingConfig" android/app/build.gradle
      - name: Build signed release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signature and version
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs $APK | grep -E "SHA-256|Verifies" 
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/aapt dump badging $APK | grep -E "package:|application-label:"
          cp $APK StorePlus-Admin.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-StorePlus-Admin.apk --yes --cleanup-tag || true
          gh release create latest-StorePlus-Admin.apk StorePlus-Admin.apk --title "Store Plus Admin APK" --notes "Run ${{ github.run_number }}"
